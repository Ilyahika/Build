<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<!-- Адрес сервера API (Render), БЕЗ / в конце. Если страница лежит на этом же сервере — можно оставить как есть. -->
<meta name="api-base" content="https://telegram-miniapp-1-4egc.onrender.com">
<title>BuildHouse</title>
<!-- Заранее открываем соединение с сервером: экономит 100–300 мс на первом запросе -->
<link rel="preconnect" href="https://telegram-miniapp-1-4egc.onrender.com">
<link rel="stylesheet" href="./style.css?v=8">
</head>
<body>
<div class="wrap">
  <header>
    <svg viewBox="0 0 48 48"><path d="M24 4 3 22h6v22h30V22h6z" fill="#ffd400"/><path d="M24 4 3 22h42z" fill="#e10600"/><rect x="20" y="28" width="9" height="16" fill="#0a0a0a"/><rect x="11" y="26" width="6" height="6" fill="#0a0a0a"/><rect x="32" y="26" width="6" height="6" fill="#0a0a0a"/></svg>
    <div><h1>Build<span>House</span></h1><small>строй · качай · богатей</small></div>
  </header>
  <div class="hz"></div>
  <div class="bar">
    <div class="cur"><i>$</i><span id="coins">—</span><small>ДОЛЛАРЫ</small></div>
    <div class="cur"><i>★</i><span id="gems">—</span><small>ЗВЁЗДЫ</small></div>
  </div>
  <!-- Сюда app.js выводит текущий экран. Пока грузится — показываем заставку со счётчиком -->
  <div id="view"><div class="panel splash"><div class="spin"></div><div id="splash-msg">Загрузка…</div></div></div>
</div>
<div id="dbg" class="panel" style="display:none;margin:12px;text-align:left"></div>
<div id="status" role="status"></div>
<nav id="nav"></nav>
<script>
/* ============ Загрузчик с диагностикой. Не зависит от внешних файлов: работает, даже если app.js или telegram.org недоступны ============ */
(function () {
  var VER = '8', T0 = Date.now(), LOG = [];
  var ICON = {ok: '✅', wait: '⏳', fail: '❌', warn: '⚠️'};
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
  function short(u) { return String(u || '').split('/').pop().split('?')[0]; }
  function report() {
    var t = LOG.map(function (l) { return l.l.toUpperCase() + ' [' + l.t + 'с] ' + l.n + ': ' + l.m; }).join('\n');
    if (window.diagReport) { try { t += '\n--- приложение ---\n' + window.diagReport(); } catch (e) {} }
    return t + '\nURL: ' + location.href.split('#')[0] + '\nUA: ' + navigator.userAgent;
  }
  window.__report = report;
  function draw(force) {
    var box = $('dbg'); if (!box) return;
    if (window.__appStarted && !force) { box.style.display = 'none'; return; }   // приложение запустилось и показывает свою диагностику
    var bad = LOG.some(function (l) { return l.l === 'fail'; });
    box.style.display = 'block';
    box.innerHTML = '<h2>' + (bad ? 'Не удалось запустить' : 'Запуск…') + ' <small style="opacity:.6">v' + VER + '</small></h2>' +
      LOG.map(function (l) { return '<p style="margin:6px 0">' + ICON[l.l] + ' <b>' + esc(l.n) + '</b><br><small style="opacity:.85;word-break:break-word">' + esc(l.m) + '</small></p>'; }).join('') +
      (bad ? '<button class="full" onclick="location.reload()">🔄 Повторить</button>' +
        '<button class="full ghost" style="margin-top:8px" onclick="try{navigator.clipboard.writeText(window.__report())}catch(e){}">📋 Скопировать отчёт</button>' +
        '<pre style="white-space:pre-wrap;font-size:11px;margin-top:10px;opacity:.7">' + esc(report()) + '</pre>' : '');
  }
  /** Запись в журнал; запись с тем же ключом обновляется (⏳ -> ✅/❌). */
  function dbg(key, name, level, msg) {
    var t = Math.round((Date.now() - T0) / 100) / 10, e = null;
    for (var i = 0; i < LOG.length; i++) if (LOG[i].k === key) e = LOG[i];
    if (e) { e.l = level; e.m = msg; e.t = t; } else LOG.push({k: key, n: name, l: level, m: msg, t: t});
    draw();
  }
  window.__dbg = dbg;

  // любые ошибки JS — на экран
  window.addEventListener('error', function (e) { dbg('js' + LOG.length, 'Ошибка JavaScript', 'fail', e.message + ' (' + short(e.filename) + ':' + e.lineno + ')'); });
  window.addEventListener('unhandledrejection', function (e) { dbg('pr' + LOG.length, 'Необработанная ошибка', 'fail', String(e.reason && e.reason.message || e.reason)); });

  dbg('page', '1. Страница', 'ok', 'index.html v' + VER + ' загружен · ' + location.origin);

  /* ---- 2. Telegram: пробуем официальный скрипт, при неудаче берём данные профиля из адреса страницы ---- */
  function hashParams() { try { return new URLSearchParams(location.hash.replace(/^#/, '')); } catch (e) { return null; } }
  function finishTelegram() {
    var W = window.Telegram && window.Telegram.WebApp, p = hashParams(), data = p && p.get('tgWebAppData') || '';
    if (W && W.initData) { window.__tg = W; dbg('tg', '2. Telegram', 'ok', 'WebApp ' + W.version + ', платформа ' + W.platform + ', initData ' + W.initData.length + ' симв.'); }
    else if (data) {                                  // telegram.org недоступен — Telegram всё равно передаёт данные в адресе
      window.__tg = {initData: data, platform: (p.get('tgWebAppPlatform') || 'hash'), version: (p.get('tgWebAppVersion') || '?'),
        ready: function () {}, expand: function () {}, disableVerticalSwipes: function () {}, isVersionAtLeast: function () { return false; }};
      dbg('tg', '2. Telegram', 'warn', 'telegram-web-app.js не загрузился (telegram.org недоступен?), но профиль получен из адреса страницы — продолжаем');
    } else {
      window.__tg = W || null;
      dbg('tg', '2. Telegram', 'fail', (W ? 'WebApp есть, но initData пустой' : 'telegram-web-app.js не загрузился и данных в адресе нет') + ' — открой Mini App кнопкой «Открыть» у бота внутри Telegram, а не ссылкой в браузере');
    }
    loadApp();
  }
  dbg('tg', '2. Telegram', 'wait', 'загружаем telegram-web-app.js (до 6 с)…');
  var tgDone = false;
  function tgOnce() { if (tgDone) return; tgDone = true; finishTelegram(); }
  var ts = document.createElement('script');
  ts.src = 'https://telegram.org/js/telegram-web-app.js';
  ts.onload = tgOnce; ts.onerror = tgOnce;
  document.head.appendChild(ts);
  setTimeout(tgOnce, 6000);

  /* ---- 3. Основной скрипт игры ---- */
  function loadApp() {
    dbg('app', '3. Скрипт игры (app.js)', 'wait', 'скачиваем (до 15 с)…');
    var done = false, s = document.createElement('script');
    s.src = './app.js?v=' + VER;
    s.onload = function () { done = true; dbg('app', '3. Скрипт игры (app.js)', window.__appStarted ? 'ok' : 'fail', window.__appStarted ? 'скачан и запущен' : 'скачан, но не выполнился до конца — смотри ошибку JavaScript ниже'); };
    s.onerror = function () {
      done = true;
      fetch('./app.js?v=' + VER, {cache: 'no-store'}).then(function (r) { dbg('app', '3. Скрипт игры (app.js)', 'fail', 'не загрузился, сервер ответил HTTP ' + r.status); })
        .catch(function (e) { dbg('app', '3. Скрипт игры (app.js)', 'fail', 'нет связи с сервером: ' + e.message); });
    };
    document.head.appendChild(s);
    setTimeout(function () { if (!done) dbg('app', '3. Скрипт игры (app.js)', 'fail', 'не скачался за 15 с — сервер спит или нет сети'); }, 15000);
  }

  /* ---- Сторож: приложение должно показать игру за 40 с ---- */
  setTimeout(function () {
    if (window.__appReady) return;
    dbg('wd', 'Сторож', 'fail', 'за 40 с игра так и не загрузилась. Последний шаг смотри выше / в отчёте.');
    draw(true);
  }, 40000);
})();
</script>
</body>
</html>
